name: Change request
description: Propose a bug fix or feature for CH09-BRK.
title: "[Change]: "
body:
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      description: Select the type that best describes this request.
      options:
        - Bug fix
        - Feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Describe the current behavior or the need for this change.
      placeholder: What happens today, and why is it a problem?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: Describe the behavior that would resolve the problem.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for considering this change complete.
      placeholder: "- [ ] The affected request behaves as expected"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Include reproduction steps, tests, or other evidence when available.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Note affected components, operational constraints, and known risks. Do not include credentials or other secrets.
    validations:
      required: false
