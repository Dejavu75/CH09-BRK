name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.meta.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile with generated build metadata
        env:
          BROKER_VERSION: 1.0.${{ github.run_number }}
        run: npm run tsc

      - name: Resolve image version
        id: meta
        shell: bash
        run: |
          version=$(node -e "const { BROKER_BUILD_INFO } = require('./build/generated/build_info.js'); process.stdout.write(BROKER_BUILD_INFO.version)")
          echo "image_version=$version" >> "$GITHUB_OUTPUT"
          echo "BROKER_VERSION=$version" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_TAG=$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dhzacur/ha_ch09_brk:${{ steps.meta.outputs.image_version }}
            dhzacur/ha_ch09_brk:latest
