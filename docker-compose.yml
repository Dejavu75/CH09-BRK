services:
  ch09:
    image: dhzacur/ha_ch09_brk
    container_name: ch09-brk
    hostname: ch09-brk
    ports:
      -  ${HOST_PORT}:${CONTAINER_PORT}
      -  ${HOST_SSL_PORT}:${CONTAINER_SSL_PORT}
    volumes:
      -  ${LOG_PATH}:/etc/nages2/logdir
      -  ${CONFIG_PATH}/.env:/app/.env
      -  ${CERT_PATH}:/app/certificados      
      -  ${SSH_KEY_HOST_PATH}:/run/secrets/ch09-brk-iis:ro
      -  ${CERTBOT_WEBROOT_PATH}:/app/certbot-www
      - type: bind
        source: ${BROKER_AUTH_HTPASSWD_HOST_PATH:?Set the BackGES credential file path on guest-local storage}
        target: /run/secrets/backges-htpasswd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BROKER_STATE_HOST_PATH:?Set the Broker state directory on guest-local storage}
        target: /app/state
        bind:
          create_host_path: false
    tmpfs:
      - /run/ch09-brk-ssh:mode=0700,size=1m
    environment:
      SSH_IDENTITY_REQUIRED: "true"
      AGES_SSH_KEY_PATH: /run/secrets/ch09-brk-iis/ch09_brk_iis
      SSH_PUBLIC_KEY_PATH: /run/secrets/ch09-brk-iis/ch09_brk_iis.pub
      CERTBOT_WEBROOT: /app/certbot-www
      BROKER_PUBLIC_ORIGIN: ${BROKER_PUBLIC_ORIGIN:?Set the exact HTTPS Broker origin}
      BROKER_AUTH_HTPASSWD_PATH: /run/secrets/backges-htpasswd
      BROKER_AUTH_DB_PATH: /app/state/sessions.sqlite
      BROKER_TIMINGS_DB_PATH: /app/state/timings.sqlite
      BROKER_SERVICE_API_KEY: ${BROKER_SERVICE_API_KEY:?Set a random service key with at least 32 bytes}
      BROKER_TRUSTED_PROXY_IPS: ${BROKER_TRUSTED_PROXY_IPS:-}
      CERT_PATH_CONTAINER: /app/certificados
    networks:
      habitatzone:
        ipv4_address: ${CONTAINER_IP}
    restart: unless-stopped
  certbot:
    image: certbot/certbot
    container_name: ch09-brk-certbot
    hostname: ch09-brk-certbot
    entrypoint: /bin/sh
    volumes:
      -  ${CERT_PATH}:/etc/letsencrypt
      -  ${CERTBOT_WEBROOT_PATH}:/var/www/certbot
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"
    restart: unless-stopped
networks:
  habitatzone:
    external: true
